services:

  backend:
    build:
      context: ./backend
    container_name: ai_resume_backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/resume_screening.db:/app/resume_screening.db

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
    container_name: ai_resume_frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped